# compose.yaml – Stand Ende Tag 4
name: notes

services:
  db:
    image: docker.io/library/postgres:18.6-alpine
    environment:
      POSTGRES_USER: notes
      POSTGRES_DB: notes
      POSTGRES_PASSWORD: lab-db-pw-123
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "notes", "-d", "notes"]
      interval: 2s
      retries: 30

  migrate:
    image: localhost/notes-api:0.1.0
    command: ["migrate"]
    environment:
      NOTES_DB_URL: postgres://notes:lab-db-pw-123@db:5432/notes
    depends_on:
      db:
        condition: service_healthy

  api:
    image: localhost/notes-api:0.1.0
    environment:
      NOTES_API_KEY: lab-api-key-123
      NOTES_DB_URL: postgres://notes:lab-db-pw-123@db:5432/notes
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: localhost/notes-web:0.1.0
    environment:
      NOTES_API_URL: http://api:8080
      NOTES_API_KEY: lab-api-key-123
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [api]

  worker:
    image: localhost/notes-worker:0.1.0
    environment:
      NOTES_API_URL: http://api:8080
      NOTES_API_KEY: lab-api-key-123
    depends_on: [api]

volumes:
  pgdata:
    external: true
    name: notes-pgdata   # dasselbe Volume wie der Quadlet-Pod (Tag 3)
