# notes-pod.yaml – Stand Ende Tag 2 (podman kube generate notes, ohne
# SandboxID-Annotationen und Zeitstempel)
# Save the output of this file and use kubectl create -f to import
# it into Kubernetes.
#
# Created with podman-5.7.0
apiVersion: v1
kind: Pod
metadata:
  labels:
    app: notes
  name: notes
spec:
  containers:
  - args:
    - postgres
    env:
    - name: POSTGRES_PASSWORD
      value: lab-db-pw-123
    - name: POSTGRES_USER
      value: notes
    - name: POSTGRES_DB
      value: notes
    image: docker.io/library/postgres:18.6-alpine
    name: notes-db
    ports:
    - containerPort: 3000
      hostIP: 127.0.0.1
      hostPort: 3000
    - containerPort: 8080
      hostIP: 127.0.0.1
      hostPort: 8080
    volumeMounts:
    - mountPath: /var/lib/postgresql
      name: notes-pgdata-pvc
  - env:
    - name: NOTES_API_KEY
      value: lab-api-key-123
    - name: NOTES_DB_URL
      value: postgres://notes:lab-db-pw-123@127.0.0.1:5432/notes
    image: localhost/notes-api:0.1.0
    name: notes-api
    securityContext: {}
  - args:
    - node
    - server.js
    env:
    - name: NOTES_API_URL
      value: http://127.0.0.1:8080
    - name: NOTES_API_KEY
      value: lab-api-key-123
    image: localhost/notes-web:0.1.0
    name: notes-web
    securityContext: {}
  volumes:
  - name: notes-pgdata-pvc
    persistentVolumeClaim:
      claimName: notes-pgdata
